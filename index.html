<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FinPi</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#050A12;color:#F0F6FF;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:2rem;text-align:center}
h1{font-size:2rem;font-weight:800;margin:.5rem 0 .3rem}
h1 b{color:#0D9488}
p{color:rgba(240,246,255,.45);font-size:.85rem;margin-bottom:2rem}
.btn{display:block;width:100%;max-width:360px;margin:.5rem auto;padding:1rem;border:none;border-radius:14px;font-size:1rem;font-weight:700;cursor:pointer;min-height:56px}
.pi{background:linear-gradient(135deg,#1E3A8A,#2563EB);color:#fff}
.gu{background:rgba(255,255,255,.08);color:rgba(240,246,255,.8);border:1px solid rgba(255,255,255,.12)}
#st{color:rgba(240,246,255,.4);font-size:.8rem;margin-top:.5rem;min-height:1.2rem}
</style>
</head>
<body>
<div style="font-size:3rem">💰</div>
<h1>Fin<b>Pi</b></h1>
<p>Pi Financial Platform · Sandbox</p>

<button class="btn pi" onclick="signIn()">π Sign In with Pi</button>
<button class="btn gu" onclick="guest()">👤 Guest Mode</button>
<div id="st"></div>

<script>
function signIn(){
  document.getElementById('st').textContent='Connecting...';
  if(typeof Pi==='undefined'){
    document.getElementById('st').textContent='Not in Pi Browser. Use guest mode.';
    return;
  }
  Pi.init({version:'2.0',sandbox:true});
  Pi.authenticate(['username','payments'],function(){})
    .then(function(a){
      localStorage.setItem('fp_user',JSON.stringify(a.user));
      document.getElementById('st').textContent='Signed in as @'+a.user.username;
      setTimeout(function(){window.location='/app.html';},800);
    })
    .catch(function(e){
      document.getElementById('st').textContent='Failed: '+(e&&e.message?e.message:'try again');
    });
}
function guest(){
  localStorage.setItem('fp_user',JSON.stringify({username:'Guest'}));
  window.location='/app.html';
}
// Auto-restore
try{if(localStorage.getItem('fp_user')){window.location='/app.html';}}catch(e){}
</script>
</body>
</html>
